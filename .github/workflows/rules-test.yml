# Tests firestore.rules in the Firestore emulator whenever the rules or their tests change.
name: Firestore rules tests
on:
  push:
    paths: ["firestore.rules", "tests/**", ".github/workflows/rules-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Run the rules tests in the emulator
        shell: bash
        run: |
          set +e
          cp ../firestore.rules firestore.rules
          npx firebase emulators:exec --only firestore --project demo-rngworld "node rules.test.mjs" > out.txt 2>&1
          status=$?
          cat out.txt
          # summary visible in the run's annotations
          msg=$(grep -E "^(ok|::error::|all checks|[0-9]+ check)|Error|error" out.txt | grep -v "^::error::" | tail -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ $status -ne 0 ]; then echo "::error title=Rules tests::$msg"; else echo "::notice title=Rules tests::$msg"; fi
          exit $status
