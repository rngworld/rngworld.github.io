# Tests firestore.rules in the Firestore emulator whenever the rules or their tests change.
name: Firestore rules tests
on:
  push:
    paths: ["firestore.rules", "tests/**", ".github/workflows/rules-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx firebase emulators:exec --only firestore --project demo-rngworld "node rules.test.mjs"
